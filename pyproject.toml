[project]
name = "recalls"
version = "0.1.0"
description = "Find out if anything you bought has been recalled."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recalls"]

[dependency-groups]
dev = ["pytest>=8"]
